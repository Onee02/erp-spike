
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      POSTGRES_DB: erp
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp"]
      interval: 3s
      retries: 20

  db_whale:
    image: postgres:16
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      POSTGRES_DB: erp
    ports:
      - "5433:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp"]
      interval: 3s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://erp:erp@db:5432/erp
      POOL_MAX: "10"
      TENANT_DSN_MAP: '{}'
      TENANT_GROUP: small
    cpus: "1.0"
    mem_limit: 512m
    depends_on:
      db:
        condition: service_healthy

  api_whale:
    build: .
    environment:
      DATABASE_URL: postgresql://erp:erp@db_whale:5432/erp
      POOL_MAX: "10"
      TENANT_DSN_MAP: '{}'
      TENANT_GROUP: whale
      SIM_API_URL: http://127.0.0.1:8000
      SIM_WHALE_WORKERS: "40"
    cpus: "1.0"
    mem_limit: 512m
    depends_on:
      db_whale:
        condition: service_healthy

  proxy:
    image: nginx:stable-alpine
    environment:
      SMALL_UPSTREAM: api:8000
      WHALE_UPSTREAM: api_whale:8000
    ports:
      - "8000:8000"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    cpus: "0.25"
    mem_limit: 64m
    depends_on:
      api:
        condition: service_started
